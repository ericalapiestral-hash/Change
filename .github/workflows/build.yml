name: build

# Manual, and on a version tag.  Building on every push would spend ten
# minutes of a Windows runner to produce something nobody asked for.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    # To attach the build to a release.  Actions artifacts were the obvious
    # place for it and turned out not to be: they are charged against an
    # account-wide storage quota that a build of this size exhausts, and the
    # failure arrives after the ten minutes of work rather than before it.
    # A release asset is not charged against it, does not expire in thirty
    # days, and has a URL that stays the same.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]" pyinstaller

      # Before building, not after.  A bundle of code that does not pass its
      # own tests on this platform is worse than no bundle: it works until
      # somebody relies on it.
      - name: Tests, on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      # Every build is version 0.3.0, so the version cannot tell one from
      # another and an updater comparing versions would never offer anything.
      # The commit is what differs, so the commit goes in the bundle.
      - name: Stamp the build
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $text = (Get-Content natvox/_build.py -Raw)
          $text = $text -replace 'COMMIT = ""', ('COMMIT = "' + $env:GITHUB_SHA + '"')
          $text = $text -replace 'BUILT = ""', ('BUILT = "' + $stamp + '"')
          Set-Content -Path natvox/_build.py -Value $text -Encoding utf8 -NoNewline
          # One line, because a PowerShell here-string is not indented and
          # breaks the YAML.  It has to be able to FAIL: an unstamped bundle
          # never offers an update and nothing downstream would notice.
          python -c "import sys; from natvox._build import COMMIT, BUILT, installed; sys.exit('the stamp did not take: %r %r' % (COMMIT, BUILT)) if len(COMMIT) != 40 or not BUILT else print('stamped', installed(), BUILT)"
          if ($LASTEXITCODE -ne 0) { throw "the build was not stamped" }

      - name: Build
        working-directory: packaging
        run: pyinstaller --clean --noconfirm --log-level WARN natvox.spec

      # The executable has to run, not merely exist. PyInstaller reports
      # success for bundles that are missing a module they only import at
      # startup, and the first anyone knows is a window that never opens.
      - name: The console build runs
        working-directory: packaging
        run: .\dist\natvox\natvox-cli.exe --check --seconds 1.0

      # A runner has no sound card, so "nothing to list" is the right answer
      # and exit 1 is how both of these say it.  What is being checked is the
      # code underneath: enumerating host APIs, and reading the per-device
      # latency fields that only a Windows driver fills in.  Neither path can
      # be exercised anywhere else -- there is no WASAPI on Linux.
      - name: The device listing and the loopback measurement run on Windows
        working-directory: packaging
        run: |
          # Continue, and reset the exit code at the end: "nothing to list" is
          # exit 1, and the step wrapper turns a non-zero $LASTEXITCODE into a
          # failed step whatever the script decided.
          $ErrorActionPreference = "Continue"
          foreach ($flag in @("--devices", "--loopback", "--update")) {
            $out = (.\dist\natvox\natvox-cli.exe $flag --attempts 1 2>&1 | Out-String)
            Write-Host "--- natvox-cli $flag ---"
            Write-Host $out
            if ($out -match "Traceback") {
              $ErrorActionPreference = "Stop"
              throw "$flag raised instead of reporting"
            }
            if (-not $out.Trim()) {
              $ErrorActionPreference = "Stop"
              throw "$flag said nothing at all"
            }
          }
          $global:LASTEXITCODE = 0

      - name: The windowed build opens and stays open
        working-directory: packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $process = Start-Process -FilePath .\dist\natvox\natvox.exe -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) {
            throw "the window exited on its own with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "stayed open"

      - name: Package
        working-directory: packaging
        run: |
          $version = (python -c "import natvox; print(natvox.__version__)")
          $zip = "natvox-$version-windows-x64.zip"
          Compress-Archive -Path dist\natvox\* -DestinationPath $zip
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "$zip  $size MB"
          "ZIP=$zip"       | Out-File -Append $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          "SIZE=$size"     | Out-File -Append $env:GITHUB_ENV

      - name: Release notes
        working-directory: packaging
        run: |
          $lines = @(
            "Built on ``windows-latest`` from ``$env:GITHUB_SHA``, $env:SIZE MB.",
            "",
            "Unzip it and run **natvox.exe**. ``natvox-cli.exe --check`` says whether",
            "this machine can keep up; ``natvox-cli.exe --devices`` lists the audio",
            "devices best host API first (Windows offers the same microphone once per",
            "API, and the copy it offers first is the slowest one); and",
            "``natvox-cli.exe --update`` checks whether a newer build has been",
            "published and ``--update --install`` fetches it, verifies its SHA-256 and",
            "swaps it in as the program exits. The window has a button for it. It never",
            "installs without being asked: this build is not code-signed, and something",
            "unsigned that also replaces itself unasked is not a thing to ship.",
            "",
            "``natvox-cli.exe --loopback`` times a sweep out of the output device and",
            "back in through the input, which is the only way to find out what the",
            "mixer and a virtual cable really cost. ``natvox-cli.exe --probe ws://...``",
            "measures what converting on another machine would cost instead.",
            "",
            "Before this was published the workflow ran the full test suite on Windows,",
            "then ran what it had built: the console executable had to print a real",
            "measurement and the windowed one had to stay open for twenty seconds.",
            "PyInstaller reports success for bundles that are missing a module they only",
            "import at startup, and the first anyone knows is a window that never opens.",
            "",
            "Not tested against real audio hardware -- a runner has no sound card. Wear",
            "headphones the first time: the output device is carrying your own voice, and",
            "speakers feeding it back into the microphone will make the engine convert",
            "its own output."
          )
          Set-Content -Path notes.md -Value $lines -Encoding utf8

      - name: Publish
        working-directory: packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF -replace "^refs/tags/", ""
          } else { "desktop-build" }

          if ($tag -eq "desktop-build") {
            # One tag, recreated each run, so the download URL never changes.
            $ErrorActionPreference = "Continue"
            gh release view $tag *> $null
            $existed = ($LASTEXITCODE -eq 0)
            if ($existed) { gh release delete $tag --yes --cleanup-tag }
            $ErrorActionPreference = "Stop"
            $global:LASTEXITCODE = 0
            gh release create $tag $env:ZIP --target $env:GITHUB_SHA --prerelease --notes-file notes.md --title "natvox $env:VERSION - Windows desktop build"
          } else {
            gh release upload $tag $env:ZIP --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing failed" }

          $url = (gh release view $tag --json url --jq .url)
          "### Windows build"                     | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "[$env:ZIP]($url) - $env:SIZE MB"       | Out-File -Append $env:GITHUB_STEP_SUMMARY

  linux:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # PortAudio and the Qt runtime libraries. There are no audio devices on
      # a runner and no screen, which is the point: the program is built so
      # that neither is needed to exercise it.
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2 libegl1 libgl1 \
            libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
