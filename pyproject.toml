[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natvox"
version = "0.1.0"
description = "Natural-sounding real-time voice changer (pitch/formant DSP + pluggable neural conversion)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "soundfile>=0.12",
]

[project.optional-dependencies]
realtime = ["sounddevice>=0.4.6"]
dev = ["pytest>=7.0"]

[project.scripts]
natvox = "natvox.cli:main"

[tool.setuptools.packages.find]
include = ["natvox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
